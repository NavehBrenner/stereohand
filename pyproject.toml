[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stereohand"
version = "0.3.0"
description = "Two webcams to metric 3D hand landmarks: ChArUco stereo calibration + MediaPipe Tasks + linear-DLT triangulation."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Naveh Brenner", email = "navegerc@gmail.com" }]
keywords = ["hand-tracking", "mediapipe", "stereo", "triangulation", "3d-pose", "opencv"]
# Every constraint below carries an upper bound on purpose. `uv.lock` is gitignored
# (library convention) and CI resolves fresh on every run, so `pyproject.toml` is the
# only thing that decides which majors this code is built against. An open
# `opencv-contrib-python>=4.9` is what let OpenCV 5 land unannounced and break live
# calibration. Raising a ceiling is a deliberate act — see AGENTS.md.
dependencies = [
    "numpy>=2.5,<3",
    # opencv-contrib (not plain opencv-python): we need cv2.aruco for ChArUco.
    # 5.x changed ChArUco point-array layout; see the draw-site reshape in calibration.py.
    "opencv-contrib-python>=5.0,<6",
    # Modern Tasks HandLandmarker API (not the legacy mediapipe.solutions.hands).
    "mediapipe>=1.0,<2",
    # Emit a correctly-scaled printable PDF of the calibration board (cv2 can't).
    "pillow>=12,<13",
]

[project.optional-dependencies]
# ruff and qualety are pre-1.0: they gate CI and add rules between *minors*, so the
# ceiling is the minor, not the major.
dev = [
    "ruff>=0.16,<0.17",
    "mypy>=2.3,<3",
    "pytest>=9,<10",
    "poethepoet>=0.48,<1",
    "qualety>=0.4,<0.5",
]
demo = ["matplotlib>=3.11,<4"]

[project.scripts]
stereohand-board = "stereohand.board:_cli"

[project.urls]
Homepage = "https://github.com/NavehBrenner/stereohand"
Issues = "https://github.com/NavehBrenner/stereohand/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/stereohand"]

[tool.ruff]
line-length = 100
target-version = "py312"
# ruff >=0.16 formats Python code blocks inside Markdown, and the pre-push hook checks
# the whole tree. The README's examples align their inline comments on purpose, which
# that formatter collapses — documentation prose is not what this gate is for.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
ignore = ["E501"] # line length is handled by formatter

[tool.ruff.lint.isort]
known-first-party = ["stereohand"]

[tool.ruff.format]
# Preview style (hugs sole bracketed args, etc). Matches the editor's
# format-on-save (`ruff.format.preview` in .vscode/settings.json) so save and
# `poe fmt`/CI agree instead of reverting each other.
preview = true

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true
# Treat cv2 / mediapipe as untyped: their bundled stubs are too strict for the dynamic
# runtime API (overloaded signatures, optional out-params), so skip analyzing them.
[[tool.mypy.overrides]]
module = ["cv2", "cv2.*", "mediapipe", "mediapipe.*", "PIL", "PIL.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]

# Project task runner (poethepoet) — `poe <task>`, same shape as kevin's.
# mypy/pytest go through `python -m` because this box's relocated .venv has stale
# console-script shebangs (ruff is a standalone binary, so it's called directly).
[tool.poe.tasks]
# Strip/sort imports (ruff check --fix, incl. the I rule) then format.
# `;` not `&&` so formatting still runs if check leaves an unfixable lint;
# `lint` and CI are the real gate.
fmt = { shell = "ruff check --fix src tests scripts; ruff format src tests scripts" }
fmt-check = "ruff format --check src tests scripts"  # non-mutating, for CI
lint = "ruff check --fix src tests scripts"
typecheck = "python -m mypy"
test = "python -m pytest -q"
# Structural rules (AST-level invariants ruff/mypy don't express). qualety ships a
# standalone binary; `python -m qualety` is the relocated-venv-safe way to reach it.
structure = "python -m qualety check"
check = ["lint", "typecheck", "structure", "test"]  # the full gate, same as CI
