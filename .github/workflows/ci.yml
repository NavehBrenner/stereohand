name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    # Pinned, not `ubuntu-latest`: the same discipline the dependencies follow. An
    # implicit image means GitHub's migration schedule picks our OS — `ubuntu-latest`
    # moves to Ubuntu 26 on 2026-10-19. Bump this deliberately.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      # Same tasks `poe check` runs locally, so CI and dev share one definition.
      - name: Lint
        run: poe lint
      - name: Format check
        run: poe fmt-check
      - name: Typecheck
        run: poe typecheck
      - name: Structural rules (qualety)
        run: poe structure
      - name: Test
        run: poe test
